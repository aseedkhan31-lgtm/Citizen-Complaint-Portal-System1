<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <!-- CDN -->
    <!-- For css -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- For js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 

<!-- Local system -->
<link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
<script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <img src="pro.jpg" width="60">
            <a class="navbar-brand fw-bold" href="#">CITIZEN PORTAL</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="portalhome.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="portalcomplaint.html">User Complaint</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="card p-4 shadow-sm">
            <h2 class="text-success border-bottom pb-2">Submit New Complaint</h2>
            <form class="was-validated">
                <div class="mb-3 mt-3">
                    <div class="mb-3">
                   <label class="form-label">Enter Name *</label><br>
                   <input type="text" class="form-control" size="30">>
                </div>
                 <div class="mb-3">
                  <label class="form-label">Enter CNIC *</label><br>
                  <input type="text"  class="form-control" size="30">
                 </div>
                    <label class="form-label fw-bold">Complaint Category:</label>
                    <select class="form-select" required>
                        <option value="">Select Category</option>
                        <option>Road Damage</option>
                        <option>Electricity Fault</option>
                        <option>Water Supply</option>
                    </select>
                    <div class="invalid-feedback">Please select a category.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Detailed Description:</label>
                    <textarea class="form-control" rows="5" required placeholder="Describe the issue..."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Evidence (Image/Video):</label>
                    <input type="file" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success px-5">Submit Complaint</button>
            </form>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p>© 2026 Citizen's Complaint Portal | HITEC University Project</p>
    </footer>
</body>
</html>
