{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citizen Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

<style>

/* ===== BODY ===== */
body{
    background-color: #f4f7f6;
    margin: 0;
}

/* ===== SIDEBAR ===== */
.sidebar{
    min-height: 100vh;
    background: #2c3e50;
    color: white;
    width: 250px;
    position: fixed;
    top: 0;
    left: 0;
    transition: 0.3s;
    z-index: 1000;
}

.sidebar .nav-link{
    color: #bdc3c7;
    padding: 15px 20px;
    transition: 0.3s;
}

.sidebar .nav-link:hover{
    color: white;
    background: #34495e;
}

/* ===== MAIN CONTENT ===== */
.main-content{
    margin-left: 250px;
    transition: 0.3s;
}

/* ===== CARD ===== */
.card{
    border: none;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    transition: 0.3s;
}

.card:hover{
    transform: translateY(-5px);
}

/* ===== TOP NAV ===== */
.top-navbar{
    background: white;
    padding: 15px 30px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* ===== MOBILE ===== */
.menu-btn{
    display: none;
    font-size: 24px;
    cursor: pointer;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px){

    .sidebar{
        left: -250px;
    }

    .sidebar.active{
        left: 0;
    }

    .main-content{
        margin-left: 0;
    }

    .menu-btn{
        display: block;
    }
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

    <div class="p-4 text-center">
        <h5>Complaint System</h5>
    </div>

    <ul class="nav nav-pills flex-column mb-auto">

        <li class="nav-item">
            <a href="{% url 'user_dashboard_view' %}" class="nav-link active">
                <i class="bi bi-house me-2"></i> Dashboard
            </a>
        </li>

        <li class="nav-item">
            <a href="{% url 'user_complain_view' %}" class="nav-link">
                <i class="bi bi-plus-circle me-2"></i> Submit Complaint
            </a>
        </li>

        <li class="nav-item">
            <a href="{% url 'track_complaint_view' %}" class="nav-link">
                <i class="bi bi-search me-2"></i> Track Complaint
            </a>
        </li>

        <li class="nav-item">
            <a href="#" class="nav-link">
                <i class="bi bi-clock-history me-2"></i> View History
            </a>
        </li>

    </ul>
</div>

<!-- MAIN -->
<div class="main-content">

    <!-- TOP NAV -->
    <div class="top-navbar">

        <span class="menu-btn" onclick="toggleSidebar()">☰</span>

        <h5 class="m-0">Overview</h5>

        <div class="d-flex align-items-center gap-3">

            <i class="bi bi-bell fs-5 position-relative">
                <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
            </i>

            <div class="dropdown">
                <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                    Profile
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#">Settings</a></li>
                    <li><a class="dropdown-item text-danger" href="#">Logout</a></li>
                </ul>
            </div>

        </div>
    </div>

    <!-- DASHBOARD CARDS -->
    <div class="container-fluid p-4">

        <div class="row g-4">

            <!-- CARD 1 -->
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <i class="bi bi-pencil-square fs-1 text-primary"></i>
                    <h5>Submit Complaint</h5>
                    <p class="text-muted">File a new concern here</p>
                    <button class="btn btn-outline-primary"
                        onclick="window.location.href='{% url 'user_complain_view' %}'">
                        Open Form
                    </button>
                </div>
            </div>

            <!-- CARD 2 -->
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <i class="bi bi-geo-alt fs-1 text-warning"></i>
                    <h5>Track Complaint</h5>
                    <p class="text-muted">Check your current status</p>
                    <button class="btn btn-outline-warning"
                        onclick="window.location.href='{% url 'track_complaint_view' %}'">
                        Track Now
                    </button>
                </div>
            </div>

            <!-- CARD 3 -->
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <i class="bi bi-clock-history fs-1 text-success"></i>
                    <h5>View History</h5>
                    <p class="text-muted">Review past submissions</p>
                    <button class="btn btn-outline-success">
                        View Archive
                    </button>
                </div>
            </div>

        </div>

    </div>

</div>

<!-- SCRIPT -->
<script>
function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("active");
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
