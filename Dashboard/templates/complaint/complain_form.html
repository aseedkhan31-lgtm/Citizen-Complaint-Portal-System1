{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complaint Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f7f6;
}
.card{
    border-radius:15px;
}
</style>

</head>

<body>

<div class="container my-5">

    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9 col-sm-12">

            <div class="card shadow-sm p-4">

                <h3 class="text-success border-bottom pb-2">
                    Submit New Complaint
                </h3>

                <form method="POST" enctype="multipart/form-data" class="needs-validation" n>
                      {% csrf_token %}
                    <!-- Name -->
                    <div class="mb-3">
                        <label class="form-label">Enter Name *</label>
                        <input type="text" class="form-control"
                               id="name"
                               name="name"
                               required
                               minlength="3"
                               pattern="[A-Za-z\s]+">
                        <div class="invalid-feedback">
                            Only letters allowed (min 3 characters)
                        </div>
                    </div>

                    <!-- CNIC -->
                    <div class="mb-3">
                        <label class="form-label">Enter CNIC *</label>
                        <input type="text" class="form-control"
                               id="cnic"
                               name="cnic"
                               required
                               pattern="\d{5}-\d{7}-\d{1}"
                               placeholder="12345-1234567-1">
                        <div class="invalid-feedback">
                            CNIC format: 12345-1234567-1
                        </div>
                    </div>

                    <!-- Category -->
                    <div class="mb-3">
                        <div class="mb-3">
    <label class="form-label">
        Complaint Category *
    </label>

    <select class="form-select"
            name="category"
            required>
        <option value="">Select Category</option>
        <option value="road">Road Damage</option>
        <option value="electricity">Electricity Fault</option>
        <option value="water">Water Supply</option>
    </select>

    <div class="invalid-feedback">
        Please select a category
    </div>
</div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label class="form-label">Description *</label>
                        <textarea class="form-control"
                                  rows="4"
                                  minlength="10"
                                  name="description"
                                  class="form-control" required
                                  required></textarea>
                        <div class="invalid-feedback">
                            Minimum 10 characters required
                        </div>
                    </div>

                    <!-- File -->
                    <div class="mb-3">
                        <label class="form-label">Evidence *</label>
                        <input type="file"
                               class="form-control"
                               id="fileInput"
                               name="evidence"
                               accept=".png,.jpg,.jpeg"
                               required>
                        <div class="invalid-feedback">
                            Only PNG, JPG, JPEG allowed
                        </div>
                    </div>

                    <!-- Button -->
                    <button type="submit" class="btn btn-success w-100">
                        Submit Complaint
                    </button>

                </form>

            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/complaint.js' %}"></script>

</body>
</html>
