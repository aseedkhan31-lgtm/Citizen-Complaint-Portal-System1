{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="{% static 'Dashboard/static/complaints/style.css' %}"> -->
           <!-- CDN -->
    <!-- For css -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- For js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 

<!-- Local system -->
<link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
<script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <img src="pro.jpg" width="60" alt="Logo">
        <a class="navbar-brand fw-bold" href="#">CITIZEN PORTAL</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'user_dashboard_view' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="{% url 'login_view' %}">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="">User Complaint</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'login_view' %}">Admin Dashboard</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-md-4">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h4 class="mb-0">Citizen Login</h4>
                </div>
                <div class="card-body p-4">
                    <form action="#" class="was-validated" novalidate>
                        
                        <div class="mb-3 mt-3">
                            <label for="email" class="form-label fw-bold">Email/Username:</label>
                            <input type="email" class="form-control" id="email" 
                                   placeholder="Enter email" name="email" required>
                            <div class="valid-feedback">Valid.</div>
                            <div class="invalid-feedback">Please enter your registered email.</div>
                        </div>

                        <div class="mb-3">
                            <label for="pwd" class="form-label fw-bold">Password:</label>
                            <input type="password" class="form-control" id="pwd" 
                                   placeholder="Enter password" name="pswd" required>
                            <div class="valid-feedback">Valid.</div>
                            <div class="invalid-feedback">Please enter your password.</div>
                        </div>

                        <div class="form-check mb-3">
                            <label class="form-check-label">
                                <input class="form-check-input" type="checkbox" name="remember"> Remember me
                            </label>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">Login</button>
                        </div>

                    </form>

                    <div class="text-center mt-3">
                        <p class="small text-muted">Don't have an account? 
                            <a href="portalregistration.html" class="text-success fw-bold">Register Now</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-4 mt-auto">
    <div class="container">
        <p class="mb-0">© 2026 Citizen's Complaint Portal | HITEC University Project</p>
    </div>
</footer>
</body>
</html>
